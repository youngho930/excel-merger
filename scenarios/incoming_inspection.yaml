name: 협력사 수입검사 결과
description: 협력사별로 보내온 수입검사 결과표를 하나로 모으고 오류를 찾습니다.
columns:
  - 기준명: 품번
    동의어: [품목코드, 부품번호, Part No, P/N, Item Code]
    필수: true
    형식: 문자
  - 기준명: 품명
    동의어: [품목명, 부품명, 자재명, Part Name, Description]
    필수: false
    형식: 문자
  - 기준명: 로트번호
    동의어: [LOT No, LOT번호, 로트, Lot, Lot Number]
    필수: true
    형식: 문자
  - 기준명: 협력사
    동의어: [업체명, 공급업체, 거래처, Supplier, Vendor]
    필수: true
    형식: 문자
  - 기준명: 검사일
    동의어: [검사일자, 검사날짜, Insp. Date, Inspection Date]
    필수: true
    형식: 날짜
  - 기준명: 입고수량
    동의어: [입고량, 입고 수량, Recv Qty, Received Qty]
    필수: true
    형식: 정수
    범위: [0, 100000]
  - 기준명: 검사수량
    동의어: [샘플수량, 시료수, 검사 수량, Insp Qty]
    필수: true
    형식: 정수
    범위: [0, 100000]
  - 기준명: 불량수량
    동의어: [불량수, 불량 수량, NG Qty, Defect Qty]
    필수: true
    형식: 정수
    범위: [0, 100000]
  - 기준명: 판정
    동의어: [검사결과, 합부판정, 판정결과, Result]
    필수: true
    형식: 문자
    허용값: [합격, 불합격]
중복기준: [품번, 로트번호]
