name: 부서별 월간 실적
description: 부서마다 제출한 월간 실적표를 하나로 모으고 오류를 찾습니다.
columns:
  - 기준명: 부서
    동의어: [부서명, 팀, 팀명, Dept, Department]
    필수: true
    형식: 문자
    허용값: [영업팀, 생산팀, 품질팀, 구매팀, 경영지원팀]
  - 기준명: 월
    동의어: [기준월, 대상월, 년월, 실적월, Month]
    필수: true
    형식: 날짜
  - 기준명: 항목
    동의어: [지표, 관리항목, 평가항목, KPI, Item]
    필수: true
    형식: 문자
  - 기준명: 목표
    동의어: [목표치, 목표값, 계획, Target, Plan]
    필수: true
    형식: 실수
    범위: [0, 1000000000]
  - 기준명: 실적
    동의어: [실적치, 실적값, 달성, Actual, Result]
    필수: true
    형식: 실수
    범위: [0, 1000000000]
  - 기준명: 비고
    동의어: [메모, 특이사항, 참고, Remark, Note]
    필수: false
    형식: 문자
중복기준: [부서, 월, 항목]
