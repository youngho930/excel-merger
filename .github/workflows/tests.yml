name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # Streamlit Community Cloud 와 같은 Linux 에서 전체 테스트를 돌린다
    # (Windows 에서는 건너뛰는 작업별 메모리 상한 테스트도 여기서 실제로 돈다)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 하위 프로세스 기본 메모리 (진단)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "from engine.jobs import run_job; print('::notice title=하위 프로세스 메모리(MB)::', run_job('mem_info', timeout=60))"

      - name: pytest (실제 Gemini API 는 부르지 않음 — 모든 AI 테스트는 가짜 응답)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -m pytest -q -rs -rf --tb=short -p no:cacheprovider 2>&1 | tee pytest.log

      # 실패하면 실패한 테스트와 오류 줄을 주석(annotation)으로 남긴다.
      # 공개 저장소의 주석은 로그인 없이도 보인다 (작업 로그는 로그인해야 보인다).
      - name: 실패 요약
        if: failure()
        run: |
          { echo "## pytest 실패"; echo '```'; grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do echo "::error title=pytest 실패::$line"; done
          grep -E "^E  " pytest.log | head -10 | while IFS= read -r line; do echo "::error title=pytest 오류 내용::$line"; done
