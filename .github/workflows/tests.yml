name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # Streamlit Community Cloud 와 같은 Linux 에서 전체 테스트를 돌린다
    # (Windows 에서는 건너뛰는 작업별 메모리 상한 테스트도 여기서 실제로 돈다)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (실제 Gemini API 는 부르지 않음 — 모든 AI 테스트는 가짜 응답)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -rs
